name: "Sphinx: Render docs"

# The site root always holds the latest build; every release also keeps its own
# copy under v<version>/ forever, so a link to old documentation keeps working.
# The versioned copies live on the gh-pages branch (that is the store), and the
# deployment itself goes through GitHub Pages' Actions pipeline: no Jekyll, and
# no rebuild of the old versions.
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mpldts/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        pip install . && pip install .[docs]
    - name: Build docs
      run: |
        cd $GITHUB_WORKSPACE/docs && make html
    - name: Take the published site from gh-pages
      run: |
        # the old versions live on gh-pages; take the tree, not the history
        git worktree add --detach "$RUNNER_TEMP/site" origin/gh-pages
        rm -rf "$RUNNER_TEMP/site/.git"
    - name: Stage the latest build and the versioned copy
      run: |
        VERSION="v$(python -c 'import mpldts; print(mpldts.__version__)')"
        SITE="$RUNNER_TEMP/site"
        rm -rf "$SITE/$VERSION"
        mkdir -p "$SITE/$VERSION"
        cp -r docs/_build/html/. "$SITE/$VERSION/"
        cp -r docs/_build/html/. "$SITE/"
        cp docs/versions.json "$SITE/versions.json"
        echo "published $VERSION" && ls "$SITE"
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ runner.temp }}/site
    - name: Deploy
      id: deploy
      uses: actions/deploy-pages@v4
