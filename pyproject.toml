[project]
name = "mplDTs"
version = "2.9.0"
description = "Set of tools to produce CMS DTs matplotlib patches"
authors = [
  { name = "Daniel Estrada", email = "destrada@cern.ch" }
]
maintainers = [
  { name = "Daniel Estrada", email = "destrada@cern.ch" }
]
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "pandas>=2.2",
    "matplotlib>=3.9.3",
    "mplhep>=0.3",
    "pytransform3d>=3.14.0"
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-copybutton"
]
dev = [
    "black"
]
test = [
    "pytest>=8"
]

[project.scripts]
mpldts = "mpldts.cli:main"

[project.urls]
Documentation = "https://intrepid-hep.github.io/mplDTs/"
Repository = "https://github.com/INTREPID-hep/mplDTs"

[tool.setuptools.packages.find]
where = ["."]
include = ["mpldts*"]

[tool.setuptools.package-data]
"mpldts.geometry" = ["*.xml"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["test/geometry", "test/downstream", "test/patches"]
addopts = "-m 'not slow'"
markers = [
    "slow: run the oracle against all 250 chambers (minutes)"
]
